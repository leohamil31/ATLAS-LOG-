name: CI (branches)

# Valida branches de trabalho antes do merge: analyze + testes + build web.
# Não publica nada — a publicação no GitHub Pages continua só no main
# (pages.yml).
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write  # temporário: publicar o preview em preview-web

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format check (informativo)
        run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Rode 'dart format lib test' para padronizar a formatação."

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Publish preview build (temporário)
        if: github.ref == 'refs/heads/redesign-3d'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/web
          git init -q -b preview-web
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "preview ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" preview-web
